<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>営業日数カウンター</title>
<style>
  :root {
    --bg: #396D89;
    --surface: #FFFFFF;
    --onbg-text: #EAF3F7;
    --text-primary: #17262E;
    --text-secondary: #4A6570;
    --accent: #A75C1B;
    --warn-bg: #FBEEE1;
    --warn-text: #7A3E0F;
    --danger: #B3261E;
    --border: #B9D2DE;
  }

  * { box-sizing: border-box; }

  [hidden] { display: none !important; }

  body {
    margin: 0;
    background: var(--bg);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    color: var(--text-primary);
    padding: 16px;
  }

  .page {
    max-width: 480px;
    margin: 0 auto;
  }

  header.hero {
    padding: 8px 0 16px;
  }

  h1 {
    font-size: 18px;
    font-weight: 700;
    color: var(--onbg-text);
    margin: 0 0 8px;
  }

  .lead {
    font-size: 14px;
    color: var(--onbg-text);
    margin: 0;
    line-height: 1.6;
  }

  .warning-banner {
    background: var(--warn-bg);
    color: var(--warn-text);
    border-radius: 6px;
    padding: 12px 16px;
    font-size: 13px;
    line-height: 1.7;
    margin-bottom: 16px;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 16px;
    margin-bottom: 16px;
  }

  .card h2 {
    font-size: 16px;
    font-weight: 700;
    margin: 0 0 16px;
    color: var(--text-primary);
  }

  label {
    display: block;
    font-size: 14px;
    color: var(--text-secondary);
    margin-bottom: 16px;
  }

  label:last-of-type {
    margin-bottom: 0;
  }

  label span.label-text {
    display: block;
    margin-bottom: 8px;
  }

  input[type="date"],
  input[type="number"] {
    display: block;
    width: 100%;
    height: 48px;
    min-height: 44px;
    font-size: 16px;
    font-family: inherit;
    color: var(--text-primary);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 0 12px;
  }

  .error {
    color: var(--danger);
    font-size: 14px;
    line-height: 1.6;
    margin-top: 16px;
  }

  .result {
    margin-top: 16px;
    padding-top: 16px;
    border-top: 1px solid var(--border);
  }

  .result-row {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    gap: 4px 8px;
    font-size: 14px;
    color: var(--text-secondary);
    padding: 4px 0;
  }

  .result-row .value {
    margin-left: auto;
    font-weight: 700;
    font-size: 18px;
    color: var(--text-primary);
  }

  .result-row .value.accent {
    color: var(--accent);
  }

  .note {
    font-size: 13px;
    color: var(--text-secondary);
    margin: 8px 0 0;
    line-height: 1.6;
  }

  button#clearBtn {
    display: block;
    width: 100%;
    height: 48px;
    min-height: 44px;
    font-size: 16px;
    font-family: inherit;
    font-weight: 700;
    color: var(--text-secondary);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    cursor: pointer;
  }

  button#clearBtn:active {
    background: var(--warn-bg);
  }
</style>
</head>
<body>
  <div class="page">
    <header class="hero">
      <h1>営業日数カウンター</h1>
      <p class="lead">2つの日付の間の、土日祝を除いた営業日数を数えます</p>
    </header>

    <div class="warning-banner">
      祝日は2026年分のみ内蔵しています。2026年以外の日付が含まれる場合は、土日のみを除外して計算します（祝日は考慮されません）。
    </div>

    <section class="card" id="cardA">
      <h2>期間で数える</h2>
      <label for="startDate"><span class="label-text">開始日</span>
        <input type="date" id="startDate">
      </label>
      <label for="endDate"><span class="label-text">終了日</span>
        <input type="date" id="endDate">
      </label>
      <div class="error" id="errorA" hidden></div>
      <div class="result" id="resultA" hidden>
        <div class="result-row">
          <span>営業日数（土日祝を除く）</span>
          <span class="value accent" id="businessDays"></span>
        </div>
        <div class="result-row">
          <span>うち土日</span>
          <span class="value" id="weekendDays"></span>
        </div>
        <div class="result-row" id="holidayRow">
          <span>うち祝日</span>
          <span class="value" id="holidayDays"></span>
        </div>
        <p class="note" id="holidayNote" hidden>祝日は未判定（2026年以外を含むため）</p>
      </div>
    </section>

    <section class="card" id="cardB">
      <h2>今日から◯営業日後を知る</h2>
      <label for="daysAhead"><span class="label-text">営業日数</span>
        <input type="number" id="daysAhead" min="1" max="365" inputmode="numeric">
      </label>
      <div class="error" id="errorB" hidden></div>
      <div class="result" id="resultB" hidden>
        <div class="result-row">
          <span>◯営業日後の日付</span>
          <span class="value accent" id="aheadDate"></span>
        </div>
        <p class="note" id="aheadHolidayNote" hidden>祝日は未判定（2026年以外の日を含むため、該当日は土日のみ除外しています）</p>
      </div>
    </section>

    <button id="clearBtn" type="button">入力を消す</button>
  </div>

<script>
(function () {
  "use strict";

  // 2026年（令和8年）の国民の祝日・休日 全18日
  // 出典: 内閣府（https://www8.cao.go.jp/chosei/shukujitsu/gaiyou.html）
  //      国立天文台暦計算室（https://eco.mtk.nao.ac.jp/koyomi/yoko/2026/rekiyou261.html）
  // の2件で突き合わせ済み（2026-09-11確認）
  var HOLIDAYS_2026 = new Set([
    "2026-01-01", // 元日
    "2026-01-12", // 成人の日
    "2026-02-11", // 建国記念の日
    "2026-02-23", // 天皇誕生日
    "2026-03-20", // 春分の日
    "2026-04-29", // 昭和の日
    "2026-05-03", // 憲法記念日
    "2026-05-04", // みどりの日
    "2026-05-05", // こどもの日
    "2026-05-06", // 休日（振替休日）
    "2026-07-20", // 海の日
    "2026-08-11", // 山の日
    "2026-09-21", // 敬老の日
    "2026-09-22", // 休日（国民の休日）
    "2026-09-23", // 秋分の日
    "2026-10-12", // スポーツの日
    "2026-11-03", // 文化の日
    "2026-11-23"  // 勤労感謝の日
  ]);

  var WEEKDAY_KANJI = ["日", "月", "火", "水", "木", "金", "土"];

  function pad2(n) {
    return n < 10 ? "0" + n : String(n);
  }

  function isoDate(date) {
    return date.getFullYear() + "-" + pad2(date.getMonth() + 1) + "-" + pad2(date.getDate());
  }

  function parseDateInput(value) {
    if (!value) return null;
    var d = new Date(value + "T00:00:00");
    if (isNaN(d.getTime())) return null;
    return d;
  }

  function isWeekend(date) {
    var day = date.getDay();
    return day === 0 || day === 6;
  }

  function isHoliday2026(date) {
    return HOLIDAYS_2026.has(isoDate(date));
  }

  function fmtDateJP(date) {
    return date.getFullYear() + "年" + (date.getMonth() + 1) + "月" + date.getDate() + "日（" + WEEKDAY_KANJI[date.getDay()] + "）";
  }

  // ---- カードA: 期間で数える ----
  var startInput = document.getElementById("startDate");
  var endInput = document.getElementById("endDate");
  var errorA = document.getElementById("errorA");
  var resultA = document.getElementById("resultA");
  var businessDaysEl = document.getElementById("businessDays");
  var weekendDaysEl = document.getElementById("weekendDays");
  var holidayRow = document.getElementById("holidayRow");
  var holidayDaysEl = document.getElementById("holidayDays");
  var holidayNote = document.getElementById("holidayNote");

  function showErrorA(message) {
    errorA.textContent = "⚠ " + message;
    errorA.hidden = false;
    resultA.hidden = true;
  }

  function clearErrorA() {
    errorA.hidden = true;
    errorA.textContent = "";
  }

  function calcCardA() {
    var startVal = startInput.value;
    var endVal = endInput.value;

    if (!startVal || !endVal) {
      clearErrorA();
      resultA.hidden = true;
      return;
    }

    var startDate = parseDateInput(startVal);
    var endDate = parseDateInput(endVal);

    if (!startDate || !endDate) {
      showErrorA("開始日と終了日は正しい日付で入力してください");
      return;
    }

    if (startDate.getTime() > endDate.getTime()) {
      showErrorA("開始日は終了日より前の日付にしてください");
      return;
    }

    clearErrorA();

    var holidaysApply = startDate.getFullYear() === 2026 && endDate.getFullYear() === 2026;
    var businessDays = 0;
    var weekendDays = 0;
    var holidayDays = 0;

    var cursor = new Date(startDate.getTime());
    cursor.setDate(cursor.getDate() + 1); // 開始日は含めず、翌日から数える

    while (cursor.getTime() <= endDate.getTime()) {
      if (isWeekend(cursor)) {
        weekendDays++;
      } else if (holidaysApply && isHoliday2026(cursor)) {
        holidayDays++;
      } else {
        businessDays++;
      }
      cursor.setDate(cursor.getDate() + 1);
    }

    businessDaysEl.textContent = businessDays + "日";
    weekendDaysEl.textContent = weekendDays + "日";

    if (holidaysApply) {
      holidayRow.hidden = false;
      holidayDaysEl.textContent = holidayDays + "日";
      holidayNote.hidden = true;
    } else {
      holidayRow.hidden = true;
      holidayNote.hidden = false;
    }

    resultA.hidden = false;
  }

  startInput.addEventListener("input", calcCardA);
  endInput.addEventListener("input", calcCardA);

  // ---- カードB: 今日から◯営業日後を知る ----
  var daysAheadInput = document.getElementById("daysAhead");
  var errorB = document.getElementById("errorB");
  var resultB = document.getElementById("resultB");
  var aheadDateEl = document.getElementById("aheadDate");
  var aheadHolidayNote = document.getElementById("aheadHolidayNote");

  function showErrorB(message) {
    errorB.textContent = "⚠ " + message;
    errorB.hidden = false;
    resultB.hidden = true;
  }

  function clearErrorB() {
    errorB.hidden = true;
    errorB.textContent = "";
  }

  function calcCardB() {
    var raw = daysAheadInput.value;

    if (raw === "") {
      clearErrorB();
      resultB.hidden = true;
      return;
    }

    var n = Number(raw);

    if (!Number.isInteger(n) || n < 1 || n > 365) {
      showErrorB("営業日数は1〜365の整数で入力してください");
      return;
    }

    clearErrorB();

    var today = new Date();
    today.setHours(0, 0, 0, 0);

    var cursor = new Date(today.getTime());
    var count = 0;
    var holidayUnjudged = false; // 経路上に2026年以外の日を1日でも通過したら true

    while (count < n) {
      cursor.setDate(cursor.getDate() + 1);
      if (isWeekend(cursor)) continue;
      if (cursor.getFullYear() === 2026) {
        if (isHoliday2026(cursor)) continue;
      } else {
        holidayUnjudged = true; // 2026年以外は祝日データを持たないため、土日のみ除外して通す
      }
      count++;
    }

    aheadDateEl.textContent = fmtDateJP(cursor);
    aheadHolidayNote.hidden = !holidayUnjudged;

    resultB.hidden = false;
  }

  daysAheadInput.addEventListener("input", calcCardB);

  // ---- 入力を消す ----
  document.getElementById("clearBtn").addEventListener("click", function () {
    startInput.value = "";
    endInput.value = "";
    daysAheadInput.value = "";
    clearErrorA();
    clearErrorB();
    resultA.hidden = true;
    resultB.hidden = true;
  });
})();
</script>
</body>
</html>
